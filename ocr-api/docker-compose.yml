version: '3.8'

services:
  ocr-app:
    build: .
    container_name: ocr_container
    ports:
      - "8000:8000"
    networks:
      - app-network

  gpt-service:
    build: ./gpt-api
    container_name: gpt_container
    ports:
      - "8001:8001" # IMPORTANT: Change if your GPT app uses a different port
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
