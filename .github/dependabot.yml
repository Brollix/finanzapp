version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend/aws-api"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "agusb"
    labels:
      - "dependencies"
      - "backend"

  # Frontend dependencies (Expo)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "agusb"
    labels:
      - "dependencies"
      - "frontend"
    # Ignore core Expo packages to manage them via 'npx expo install'
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"

  # Website dependencies
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "agusb"
    labels:
      - "dependencies"
      - "website"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    reviewers:
      - "agusb"
    labels:
      - "dependencies"
      - "github-actions"
