name: Website CI

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: website/package-lock.json
        continue-on-error: true

      - name: Install dependencies
        working-directory: ./website
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Type check
        working-directory: ./website
        run: npm run type-check

      - name: Lint
        working-directory: ./website
        run: npm run lint
        continue-on-error: true

  build:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: website/package-lock.json
        continue-on-error: true

      - name: Install dependencies
        working-directory: ./website
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Next.js
        working-directory: ./website
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: ./website
        run: |
          docker build -t finanzapp-website:test .

      - name: Test Docker image
        run: |
          docker run --rm finanzapp-website:test node -e "console.log('Docker image works!')"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            echo "📥 Pulling latest changes..."
            cd ~/finanzapp
            git fetch origin main
            git reset --hard origin/main
            echo "🚀 Deploying website..."
            cd website
            chmod +x deploy.sh
            ./deploy.sh
            echo "✅ Deployment completed!"
          ENDSSH

      - name: Health Check
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "🏥 Checking website health..."
          sleep 10
          MAX_RETRIES=6
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if ssh $SSH_USER@$SSH_HOST "curl -f http://localhost:3000 > /dev/null 2>&1"; then
              echo "✅ Website is healthy!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 10
          done
          echo "❌ Website health check failed"
          exit 1
