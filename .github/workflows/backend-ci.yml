name: Backend CI

on:
  pull_request:
    paths:
      - "backend/aws-api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/aws-api/**"
      - ".github/workflows/backend-ci.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/aws-api/package-lock.json

      - name: Install dependencies
        working-directory: ./backend/aws-api
        run: npm ci

      - name: Type check
        working-directory: ./backend/aws-api
        run: npm run type-check

      - name: Run tests
        working-directory: ./backend/aws-api
        run: npm test

      - name: Generate coverage report
        working-directory: ./backend/aws-api
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          directory: ./backend/aws-api
          files: ./coverage/lcov.info
          flags: backend
          name: backend-coverage
        continue-on-error: true

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/aws-api/package-lock.json

      - name: Install dependencies
        working-directory: ./backend/aws-api
        run: npm ci

      - name: Run ESLint (if configured)
        working-directory: ./backend/aws-api
        run: |
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ]; then
            npx eslint src --ext .ts || echo "ESLint not configured, skipping"
          else
            echo "ESLint not configured, skipping"
          fi
        continue-on-error: true

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        working-directory: ./backend/aws-api
        run: |
          docker build -t finanzapp-backend:test .

      - name: Test Docker image
        run: |
          docker run --rm finanzapp-backend:test node -e "console.log('Docker image works!')"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [test, lint, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >>~/.ssh/config <<END
          Host *
            StrictHostKeyChecking no
          END
          if [ -n "$SSH_HOST" ]; then
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts || true
          fi

      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            echo "📥 Pulling latest changes..."
            cd ~/finanzapp
            git pull origin main

            echo "🔧 Updating Nginx config..."
            sudo cp backend/aws-api/nginx/finanzapp.conf /etc/nginx/conf.d/finanzapp.conf
            sudo nginx -t && sudo systemctl reload nginx

            echo "🚀 Deploying backend..."
            cd backend/aws-api
            chmod +x deploy.sh
            ./deploy.sh
            echo "✅ Deployment completed!"
          ENDSSH

      - name: Deploy Website
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            echo "🌐 Deploying website..."
            cd ~/finanzapp/website
            chmod +x deploy.sh
            ./deploy.sh
            echo "✅ Website deployment completed!"
          ENDSSH

      - name: Health Check
        env:
          API_URL: ${{ secrets.EC2_API_URL }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "🏥 Checking API health..."
          sleep 10
          MAX_RETRIES=6
          RETRY_COUNT=0

          # Check API health
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f $API_URL/api/health; then
              echo "✅ API is healthy!"
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 10
          done

          if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
            echo "❌ API health check failed"
            exit 1
          fi

          # Check website health
          echo "🏥 Checking website health..."
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f $API_URL/ > /dev/null 2>&1; then
              echo "✅ Website is healthy!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 10
          done

          echo "❌ Website health check failed"
          exit 1
