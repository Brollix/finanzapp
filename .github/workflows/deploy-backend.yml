name: Deploy Backend to EC2 (Legacy)

# This workflow is kept for manual deployments
# CI/CD is now handled by backend-ci.yml

on:
  workflow_dispatch: # Solo permite ejecutar manualmente

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            
            echo "📥 Pulling latest changes..."
            cd ~/finanzapp
            git pull origin main
            
            echo "🔧 Updating Nginx config..."
            sudo cp backend/aws-api/nginx/finanzapp.conf /etc/nginx/conf.d/finanzapp.conf
            sudo nginx -t && sudo systemctl reload nginx
            
            echo "🚀 Deploying backend..."
            cd backend/aws-api
            chmod +x deploy.sh
            ./deploy.sh
            
            echo "✅ Deployment completed!"
          ENDSSH

      - name: Health Check
        env:
          API_URL: ${{ secrets.EC2_API_URL }}
        run: |
          echo "🏥 Checking API health..."
          sleep 10

          MAX_RETRIES=6
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f $API_URL/health; then
              echo "✅ API is healthy!"
              exit 0
            fi
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Retry $RETRY_COUNT/$MAX_RETRIES..."
            sleep 10
          done

          echo "❌ API health check failed"
          exit 1

      - name: Cleanup old Docker images on EC2
        if: success()
        env:
          SSH_HOST: ${{ secrets.EC2_HOST }}
          SSH_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh $SSH_USER@$SSH_HOST << 'ENDSSH'
            echo "🧹 Post-deployment cleanup agresivo..."
            
            # 1. Remover imágenes antiguas (mantener solo las últimas 2)
            echo "Limpiando imágenes antiguas de finanzapp-backend..."
            docker images finanzapp-backend -q | tail -n +3 | xargs -r docker rmi -f 2>/dev/null || true
            
            # 2. Remover TODAS las imágenes sin tag (dangling)
            echo "Removiendo imágenes dangling..."
            docker images -f "dangling=true" -q | xargs -r docker rmi -f 2>/dev/null || true
            
            # 3. Limpiar contenedores detenidos
            echo "Limpiando contenedores detenidos..."
            docker container prune -f
            
            # 4. Limpiar build cache antiguo (>24h)
            echo "Limpiando build cache..."
            docker builder prune -f --filter "until=24h"
            
            # 5. Limpiar networks no usadas
            echo "Limpiando networks..."
            docker network prune -f
            
            # 6. Limpiar volumes no usados
            echo "Limpiando volumes huérfanos..."
            docker volume prune -f
            
            # 7. Mostrar estado final
            echo ""
            echo "📊 Estado final:"
            docker system df
            echo ""
            echo "💾 Espacio en disco:"
            df -h / | grep -E '(Filesystem|/dev/root)'
            
            echo "✅ Cleanup completado"
          ENDSSH

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above."
          # Aquí puedes agregar notificaciones (Slack, Discord, email, etc.)
