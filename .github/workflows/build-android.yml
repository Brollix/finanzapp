name: Build Android App

on:
  push:
    tags:
      - "v*" # Se dispara cuando se hace push de un tag que comience con 'v'
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

jobs:
  build:
    name: EAS Build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Android APK
        working-directory: ./frontend
        run: eas build --platform android --profile production --non-interactive --no-wait

      - name: Build info
        run: |
          echo "✅ Build iniciado exitosamente"
          echo "📱 Plataforma: Android"
          echo "🏷️  Versión: ${{ steps.version.outputs.VERSION }}"
          echo "📦 Perfil: production"
          echo ""
          echo "El build se está ejecutando en los servidores de Expo."
          echo "Puedes ver el progreso en: https://expo.dev"
